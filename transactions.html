<!DOCTYPE html>
<html>
<head>
    <title>Merchant Demo — Транзакции</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: monospace; margin: 2rem; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 1rem; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #eee; }
        .loading { text-align: center; padding: 1rem; color: #666; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Транзакции (обновление раз в 5 сек)</h1>
        <div id="transactions-list">Загрузка...</div>
    </div>
    <script>
        const API_URL = 'https://lol-production-14ea.up.railway.app/api/v1/transactions';
        async function loadTransactions() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                renderTransactions(data);
            } catch (error) {
                document.getElementById('transactions-list').innerHTML = `<div class="error">Ошибка загрузки: ${error.message}</div>`;
            }
        }
        function renderTransactions(transactions) {
            if (!transactions || transactions.length === 0) {
                document.getElementById('transactions-list').innerHTML = '<div>Нет транзакций</div>';
                return;
            }
            let html = '<table><tr><th>ID</th><th>Сумма</th><th>Статус</th><th>Provider TX ID</th><th>Дата</th></tr>';
            for (const tx of transactions) {
                html += `<tr>
                    <td>${tx.id || ''}</td>
                    <td>${tx.amount || ''}</td>
                    <td>${tx.status || ''}</td>
                    <td>${tx.provider_transaction_id || ''}</td>
                    <td>${tx.created_at ? new Date(tx.created_at).toLocaleString() : ''}</td>
                </tr>`;
            }
            html += '</table>';
            document.getElementById('transactions-list').innerHTML = html;
        }
        loadTransactions();
        setInterval(loadTransactions, 5000);
    </script>
</body>
</html>
